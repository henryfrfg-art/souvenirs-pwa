<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Souvenirs">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><title>Souvenirs</title>
<style>
:root{--bg:#F7F3EC;--card:#fff;--tx:#3E3226;--mu:#A79784;--ln:#ECE3D6;--ac:#C9824E;--ac2:#E8B4A0;--on:#fff;--r:18px}
[data-t=v1d]{--bg:#1C1812;--card:#2A2420;--tx:#EFE7DA;--mu:#9A8C7A;--ln:#3A332C;--ac:#B37048;--ac2:#6B4A32}
[data-t=light]{--bg:#F5F6F8;--card:#fff;--tx:#1B1F27;--mu:#8A91A0;--ln:#E6E8ED;--ac:#3B3F4A;--ac2:#E6E8ED}
[data-t=dark]{--bg:#0F1115;--card:#1A1D24;--tx:#ECEEF2;--mu:#8A91A0;--ln:#2A2E38;--ac:#8A91A0;--ac2:#2A2E38}
[data-t=aurora]{--bg:#F6F3FF;--card:#fff;--tx:#2B2540;--mu:#9A92B5;--ln:#E7E0FA;--ac:#8B6FE0;--ac2:#DCD2FA}
[data-t=zenith]{--bg:#0D0B14;--card:#1A1626;--tx:#EEE9FB;--mu:#8F86AD;--ln:#2C2540;--ac:#9D7BFF;--ac2:#3A2E63}
[data-t=nexora]{--bg:#F6F5EF;--card:#fff;--tx:#2E352B;--mu:#8F9A88;--ln:#E4E7DB;--ac:#7C9A78;--ac2:#D6E2D0}
[data-t=velora]{--bg:#FFF5F7;--card:#fff;--tx:#43292F;--mu:#B58F98;--ln:#F7DDE3;--ac:#E58AA3;--ac2:#F9D3DD}
[data-t=blue]{--bg:#F4F8FF;--card:#fff;--tx:#14233B;--mu:#7D90B0;--ln:#DFE8F7;--ac:#2F6BFF;--ac2:#D5E3FF}
[data-t=forest]{--bg:#0F1A14;--card:#17261D;--tx:#E6F0E8;--mu:#86A18F;--ln:#243A2D;--ac:#5FAE7A;--ac2:#2C4A38}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:18px}h1{font-size:26px;margin:6px 0 14px}h2{font-size:15px;color:var(--mu);margin:0 0 6px;font-weight:600}
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:16px;margin-top:14px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
button,input,textarea{font:inherit;color:inherit}button{border:0;border-radius:14px;padding:11px 16px;background:var(--ac);color:var(--on);font-weight:600;cursor:pointer}
button.g{background:var(--ac2);color:var(--tx)}button.d{background:none;color:#C0504D;padding:6px}button.l{background:none;color:var(--ac);padding:6px}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:11px;margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;background:var(--card);border-top:1px solid var(--ln);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav button{background:none;color:var(--mu);flex:1;max-width:160px;font-size:13px}nav button.on{color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.grid b{font-size:12px;color:var(--mu)}
.c{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:14px;background:none;color:var(--tx);padding:0}.c.h{background:var(--ac2);font-weight:700}.c.s{outline:2px solid var(--ac)}.c.sm{font-size:11px}
.ph{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.ph img{width:84px;height:84px;object-fit:cover;border-radius:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.th{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.th div{border:2px solid var(--ln);border-radius:14px;padding:10px;cursor:pointer;background:var(--bg)}.th div.on{border-color:var(--ac)}.th i{display:inline-block;width:18px;height:18px;border-radius:50%;margin-right:4px;border:1px solid var(--ln)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9}#lb img{max-width:100%;max-height:90%}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;display:none;z-index:10}
.gate{min-height:80vh;display:flex;flex-direction:column;justify-content:center;text-align:center}
</style></head>
<body data-t="aurora"><main id="app"></main><nav id="nav"></nav><div id="lb" onclick="this.style.display='none'"><img id="lbi"></div><div id="toast"></div>
<script>
const SERVER='https://calendrier-souvenirs-serveur.onrender.com/api';
const THEMES=[['v1','V1 · Automne','#F7F3EC','#C9824E'],['v1d','V1 · Sombre','#1C1812','#B37048'],['aurora','Aurora','#F6F3FF','#8B6FE0'],['zenith','Zenith','#0D0B14','#9D7BFF'],['nexora','Nexora','#F6F5EF','#7C9A78'],['velora','Velora','#FFF5F7','#E58AA3'],['light','Light','#F5F6F8','#3B3F4A'],['dark','Dark','#0F1115','#8A91A0'],['blue','Clean Blue','#F4F8FF','#2F6BFF'],['forest','Forest','#0F1A14','#5FAE7A']];
const IDEAS=['Pique-nique improvisé 🧺','Soirée film sous la couette 🎬','Balade en forêt 🌲','Aller voir la mer 🌊','Faire des crêpes ensemble 🥞','Soirée étoiles ✨','Brunch maison ☕','Faire un puzzle 🧩','Balade à vélo 🚲','Dîner aux chandelles 🕯️','Escape game 🔐','Cueillette de fruits 🍓'];
const MONTHS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const L=k=>localStorage.getItem(k)||'',S=(k,v)=>localStorage.setItem(k,v);
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let db=null,tab='home',ideaI=0,vm=new Date().getMonth(),vy=new Date().getFullYear(),sel=null,editId=null,delId=null,photos=[];
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
async function api(p,o={}){const r=await fetch(SERVER+p,{...o,headers:{'Content-Type':'application/json','x-code':L('code')}});if(r.status==401){S('code','');render();throw new Error('401')}return r.json()}
async function load(){try{db=await api('/data');db.ideas=db.ideas||[];db.memories=db.memories||[];render()}catch(e){if(!db)$('app').innerHTML='<div class="card">Connexion au serveur… (peut prendre 50 s au réveil)</div>'}}
function setTheme(t){S('theme',t);document.body.dataset.t=t;document.querySelector('meta[name=theme-color]')||document.head.insertAdjacentHTML('beforeend','<meta name="theme-color">');document.querySelector('meta[name=theme-color]').content=getComputedStyle(document.body).getPropertyValue('--bg')}
function shrink(f){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.6))};i.src=r.result};r.readAsDataURL(f)})}
async function pick(el){for(const f of el.files)photos.push(await shrink(f));render()}
const photoCount=a=>a.reduce((n,m)=>n+(m.photos||[]).length,0);
function imgs(a){return `<div class="ph">${(a||[]).map(p=>`<img src="${p}" onclick="zoom(this.src)">`).join('')}</div>`}
function zoom(s){$('lbi').src=s;$('lb').style.display='flex'}
function card(m){
 if(editId===m.id)return `<div class="card"><h2>Modifier</h2><textarea id="et">${esc(m.text)}</textarea><input id="ed" type="date" value="${m.date}"><div class="row" style="margin-top:10px"><button onclick="saveEdit(${m.id})">Enregistrer</button><button class="g" onclick="editId=null;render()">Annuler</button></div></div>`;
 return `<div class="card"><h2>${pd(m.date).toLocaleDateString('fr-FR')}${m.addedBy?' · '+esc(m.addedBy):''}</h2><div>${esc(m.text)}</div>${imgs(m.photos)}
 <div class="row">${delId===m.id?`<span>Supprimer ?</span><button class="d" onclick="del(${m.id})">Oui</button><button class="l" onclick="delId=null;render()">Non</button>`:`<button class="l" onclick="editId=${m.id};render()">✏️ Modifier</button><button class="d" onclick="delId=${m.id};render()">🗑️ Supprimer</button>`}</div></div>`}
async function saveEdit(id){await api('/memories/'+id,{method:'PUT',body:JSON.stringify({text:$('et').value.trim(),date:$('ed').value})});editId=null;toast('Souvenir modifié');load()}
async function del(id){await api('/memories/'+id,{method:'DELETE'});delId=null;toast('Souvenir supprimé');load()}
async function addMem(){const t=$('nt').value.trim();if(!t)return toast('Ajoute une description');await api('/memories',{method:'POST',body:JSON.stringify({text:t,date:$('nd').value||iso(new Date()),photos,addedBy:L('name')||null})});photos=[];toast('Souvenir ajouté 💛');load()}
async function newIdea(){const f=IDEAS.filter(i=>!db.ideas.includes(i));if(!f.length)return toast('Vous avez déjà toutes mes idées 😄');await api('/ideas',{method:'POST',body:JSON.stringify({text:f[Math.floor(Math.random()*f.length)]})});ideaI=db.ideas.length;load()}
async function myIdea(){const t=prompt("Ton idée d'activité :");if(t&&t.trim()){await api('/ideas',{method:'POST',body:JSON.stringify({text:t.trim()})});ideaI=db.ideas.length;load()}}
function home(){const n=db.ideas.length,idea=n?db.ideas[ideaI%n]:'…',st={};db.memories.forEach(m=>{const k=m.addedBy||'—';st[k]=(st[k]||0)+1});
 return `<h1>Nos souvenirs 💛</h1><div class="card" style="text-align:center"><h2>Idée du jour · touche pour la suivante</h2><div style="font-size:18px;cursor:pointer" onclick="ideaI++;render()">${esc(idea)}</div><div class="row" style="justify-content:center;margin-top:12px"><button class="g" onclick="newIdea()">🎲 Nouvelle idée</button><button class="g" onclick="myIdea()">＋ La mienne</button></div></div>
 <div class="card"><h2>Ajouter un souvenir</h2><textarea id="nt" placeholder="Ce qu'on a vécu…"></textarea><input id="nd" type="date" value="${iso(new Date())}"><div class="row" style="margin-top:10px"><label class="g" style="padding:11px 16px;border-radius:14px;background:var(--ac2);cursor:pointer">📷 Photos<input type="file" accept="image/*" multiple hidden onchange="pick(this)"></label><button onclick="addMem()">Ajouter</button></div>${imgs(photos)}</div>
 <div class="card"><h2>Souvenirs ajoutés</h2>${Object.entries(st).map(([k,v])=>`<div class="row sp"><span>${esc(k)}</span><b>${v}</b></div>`).join('')||'Aucun pour l\'instant'}</div>`}
function cal(){const by={};db.memories.forEach(m=>{const d=pd(m.date);if(d.getMonth()==vm&&d.getFullYear()==vy)(by[d.getDate()]=by[d.getDate()]||[]).push(m)});
 const f=(new Date(vy,vm,1).getDay()+6)%7,nd=new Date(vy,vm+1,0).getDate();let c='';for(let i=0;i<f;i++)c+='<span></span>';
 for(let d=1;d<=nd;d++){const a=by[d],n=a?photoCount(a):0,lab=!a||!n?d:n==1?'📷':'📷'+n;c+=`<button class="c ${a?'h':''} ${sel==d?'s':''} ${String(lab).length>2?'sm':''}" onclick="sel=${sel==d?'null':d};render()">${lab}</button>`}
 const day=sel?(by[sel]||[]):[],ds=sel?`${vy}-${String(vm+1).padStart(2,'0')}-${String(sel).padStart(2,'0')}`:'';
 return `<h1>Calendrier</h1><div class="card"><div class="row sp"><button class="l" onclick="vm--;if(vm<0){vm=11;vy--}sel=null;render()">‹</button><b>${MONTHS[vm]} ${vy}</b><button class="l" onclick="vm++;if(vm>11){vm=0;vy++}sel=null;render()">›</button></div><div class="grid" style="margin-top:8px">${['L','M','M','J','V','S','D'].map(x=>`<b>${x}</b>`).join('')}${c}</div></div>${day.map(card).join('')}${sel?`<div class="card"><h2>${day.length?'Ajouter un autre souvenir ce jour':'Ajouter un souvenir ce jour'}</h2><textarea id="nt"></textarea><input id="nd" type="hidden" value="${ds}"><div class="row" style="margin-top:10px"><label style="padding:11px 16px;border-radius:14px;background:var(--ac2);cursor:pointer">📷 Photos<input type="file" accept="image/*" multiple hidden onchange="pick(this)"></label><button onclick="addMem()">Ajouter</button></div>${imgs(photos)}</div>`:''}`}
function settings(){return `<h1>Réglages</h1><div class="card"><h2>Ton prénom</h2><input id="nm" value="${esc(L('name'))}" onchange="S('name',this.value.trim());toast('Prénom enregistré')"></div><div class="card"><h2>Thème</h2><div class="th">${THEMES.map(t=>`<div class="${document.body.dataset.t==t[0]?'on':''}" onclick="setTheme('${t[0]}');render()"><i style="background:${t[2]}"></i><i style="background:${t[3]}"></i><br><b>${t[1]}</b></div>`).join('')}</div></div><div class="card"><button class="g" onclick="S('code','');render()">Changer de code</button></div>`}
function render(){
 if(!L('code')){$('nav').innerHTML='';$('app').innerHTML='<div class="gate"><h1>💛 Souvenirs</h1><p>Entre votre code secret</p><input id="cd" type="password" placeholder="Code" style="text-align:center"><div style="margin-top:12px"><button onclick="S(\'code\',$(\'cd\').value.trim());load()">Entrer</button></div></div>';return}
 $('nav').innerHTML=[['home','🏠 Accueil'],['cal','📅 Calendrier'],['set','⚙️ Réglages']].map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('');
 if(!db){$('app').innerHTML='<div class="card">Chargement…</div>';return}
 const y=scrollY;$('app').innerHTML=tab=='home'?home():tab=='cal'?cal():settings();scrollTo(0,y)}
setTheme(L('theme')||'aurora');if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
render();if(L('code'))load();setInterval(()=>{if(L('code')&&!editId&&!document.activeElement.matches('input,textarea'))load()},20000);
</script></body></html>
